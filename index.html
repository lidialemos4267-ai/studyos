<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StudyOS</title>
<meta name="description" content="Sistema inteligente de estudos para concursos — Câmara de Cuiabá e Chapada dos Guimarães (Selecon).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><span class="logo">S</span><span>Study<b>OS</b></span></div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <div class="save" id="saveState">—</div>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <main class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Abrir menu">☰</button>
      <h1 id="pageTitle">Dashboard</h1>
      <div class="top-actions">
        <select id="concFilter" aria-label="Filtrar por concurso"></select>
        <button class="btn sm ghost" id="quickSession" title="Registrar estudo">+ Registrar estudo</button>
      </div>
    </header>
    <div id="banner"></div>
    <section id="view" class="view"></section>
  </main>
</div>
<div id="modalRoot"></div>
<div id="toasts" class="toasts" aria-live="polite"></div>

<script src="js/seed.js"></script>
<script src="js/core.js"></script>
<script src="js/engine.js"></script>
<script src="js/ui.js"></script>
<script src="js/modules/dashboard.js"></script>
<script src="js/modules/edital.js"></script>
<script src="js/modules/plano.js"></script>
<script src="js/modules/desempenho.js"></script>
<script src="js/modules/erros.js"></script>
<script src="js/modules/flashcards.js"></script>
<script src="js/modules/revisoes.js"></script>
<script src="js/modules/discursivas.js"></script>
<script src="js/modules/simulados.js"></script>
<script src="js/modules/config.js"></script>
<script src="js/modules/tec.js"></script>
<script src="js/modules/leis.js"></script>
<script src="js/app.js"></script>
<script>
  // Aviso quando o index.html é aberto sem as pastas css/ e js/ (ex.: direto de dentro do ZIP)
  if (!window.SOS || !window.SOS.app) {
    document.body.innerHTML = '<div style="max-width:640px;margin:40px auto;padding:24px;font:16px/1.6 system-ui,sans-serif;border:2px solid #dc2626;border-radius:12px">' +
      '<h2 style="margin-top:0;color:#dc2626">O StudyOS não carregou</h2>' +
      '<p>Parece que este arquivo foi aberto <b>de dentro do ZIP</b> (ou separado das pastas <code>css</code> e <code>js</code>).</p>' +
      '<ol><li>Feche esta aba.</li><li>Clique com o botão direito no arquivo <b>.zip</b> › <b>Extrair tudo…</b> › <b>Extrair</b>.</li>' +
      '<li>Abra a pasta extraída e dê dois cliques no <b>index.html</b> que está ao lado das pastas <code>css</code> e <code>js</code>.</li></ol>' +
      '<p style="color:#555">Seus dados não foram afetados.</p></div>';
  }
</script>
</body>
</html>
